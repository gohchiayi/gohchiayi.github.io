
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>GOH CHIAYI — A Sky Full of Memories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030712;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: relative;
    z-index: 2;
    height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
}

.name {
    font-size: clamp(30px, 8vw, 48px);
    font-weight: 400;
    letter-spacing: 8px;
    text-shadow: 0 0 25px rgba(130, 255, 220, .45);
}

.subtitle {
    margin-top: 20px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(220, 245, 255, .7);
}

.line {
    width: 55px;
    height: 1px;
    margin: 32px 0;
    background: rgba(180, 255, 240, .7);
    box-shadow: 0 0 12px #8affdf;
}

.footer {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(220, 245, 255, .65);
}

</style>
</head>

<body>

<canvas id="sky"></canvas>

<div class="content">
    <div class="name">GOH CHIAYI</div>
    <div class="subtitle">A SKY FULL OF MEMORIES</div>
    <div class="line"></div>
    <div class="footer">FOREVER UNDER THE SAME SKY</div>
</div>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");

let width, height, stars = [];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({length: 130}, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5,
        a: Math.random(),
        speed: Math.random() * 0.012 + 0.003
    }));
}

window.addEventListener("resize", resize);
resize();

function drawStars() {
    stars.forEach(s => {
        s.a += s.speed;
        const opacity = 0.25 + Math.abs(Math.sin(s.a)) * 0.65;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,245,255,${opacity})`;
        ctx.fill();
    });
}

function drawAurora(time) {
    ctx.clearRect(0, 0, width, height);

    const bg = ctx.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, "#020611");
    bg.addColorStop(0.55, "#07152a");
    bg.addColorStop(1, "#030712");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalCompositeOperation = "screen";

    const colors = [
        [30, 255, 190],
        [30, 180, 255],
        [130, 90, 255],
        [40, 255, 220]
    ];

    colors.forEach((color, index) => {
        const wave = ctx.createLinearGradient(
            0, height * 0.15, 0, height * 0.8
        );

        wave.addColorStop(0, "rgba(0,0,0,0)");
        wave.addColorStop(
            0.4,
            `rgba(${color.join(",")},0.13)`
        );
        wave.addColorStop(
            0.7,
            `rgba(${color.join(",")},0.025)`
        );
        wave.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = wave;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.3);

        for (let x = 0; x <= width; x += 5) {
            const y =
                height * 0.36 +
                Math.sin(x * 0.006 + time * 0.0004 + index) * 55 +
                Math.sin(x * 0.002 - time * 0.00025) * 45;

            ctx.lineTo(x, y + index * 24);
        }

        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();
    });

    ctx.restore();
    drawStars();
}

function animate(time) {
    drawAurora(time);
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
