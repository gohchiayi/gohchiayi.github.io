<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030712;font-family:Georgia,"Times New Roman",serif}
body{color:white}
canvas{position:fixed;inset:0;width:100%;height:100%}

.content{

#secretMessage.show .letter-title{opacity:1;transform:translateY(0)}

}
#wishPanel.active{display:flex}
.wish-card{

}
.wish-heading{font-size:17px;letter-spacing:4px;margin-bottom:8px}
.wish-description{font-family:Arial,sans-serif;font-size:10px;line-height:1.8;color:rgba(195,220,255,.7);margin-bottom:18px}
.wish-input{
 display:block;width:100%;margin-top:12px;padding:12px;
 border:1px solid rgba(160,210,255,.2);border-radius:8px;
 outline:none;background:rgba(255,255,255,.04);color:white;font-size:14px
}
.wish-input::placeholder{color:rgba(220,235,255,.4)}
#wishText{min-height:100px;resize:vertical}
.wish-action{
 width:100%;margin-top:14px;padding:12px;border:1px solid rgba(160,210,255,.3);
 border-radius:8px;background:rgba(80,130,200,.15);color:white;
 letter-spacing:2px;cursor:pointer
}
#wishClose{margin-top:16px;border:0;background:transparent;color:rgba(220,235,255,.6);cursor:pointer}
#wishStatus{min-height:22px;margin-top:12px;color:rgba(190,220,255,.85);font-size:11px;line-height:1.6}
#wishList{margin-top:18px;text-align:left}
.wish-item{padding:12px;margin-top:9px;border:1px solid rgba(160,210,255,.16);border-radius:8px;background:rgba(255,255,255,.035)}
.wish-item-text{font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}

@media(max-height:700px){

<script>
/* ===================================
   ORIGINAL AURORA + CANVAS
=================================== */

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");
let width,height,stars=[];
let showGraduationPhoto=false;
let showStarCoordinates=false;
let constellationStartedAt=0;

const graduationPhoto=new Image();
graduationPhoto.src="images/chiayi.jpg";

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 width=window.innerWidth;
 height=window.innerHeight;
 canvas.width=width*dpr;
 canvas.height=height*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:130},()=>({
  x:Math.random()*width,y:Math.random()*height,
  r:Math.random()*1.5,a:Math.random(),
  speed:Math.random()*.012+.003
 }));
}
window.addEventListener("resize",resize);
resize();

function drawStars(){
 stars.forEach(s=>{
  s.a+=s.speed;
  const opacity=.25+Math.abs(Math.sin(s.a))*.65;
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fillStyle=`rgba(220,245,255,${opacity})`;
  ctx.fill();
 });
}

/* ===================================
   3D TAURUS PARTICLE CONSTELLATION
   10 seconds, aurora stays running
=================================== */

function drawStarCoordinates(time){
 if(!showStarCoordinates)return;

 const elapsed=time-constellationStartedAt;
 const duration=10000;
 if(elapsed>=duration){showStarCoordinates=false;return;}

 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const ease=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};

 const fadeIn=ease(elapsed/900);
 const fadeOut=1-ease((elapsed-8300)/1700);
 const opacity=fadeIn*fadeOut;

 const scale=Math.min(width/390,height/780,1);
 const cx=width/2;
 const cy=height*.30;

 ctx.save();
 ctx.globalAlpha=opacity;

 /* 3D Taurus points: x, y, z */
 const points=[
  [-105,-25,10],[-65,-75,0],[-15,-55,25],
  [30,-90,-15],[75,-48,15],[105,5,-10],
  [45,15,30],[-10,35,-20],[-65,10,15],
  [5,-5,45],[115,-85,-35]
 ];
 const links=[[0,1],[1,2],[2,3],[2,4],[4,5],[4,6],[6,7],[7,8],[2,9],[3,10]];

 const rotation=elapsed*.00025;
 const tilt=Math.sin(elapsed*.0004)*.16;
 const camera=520;

 function project(point){
  const [x,y,z]=point;
  const rx=x*Math.cos(rotation)-z*Math.sin(rotation);
  const rz=x*Math.sin(rotation)+z*Math.cos(rotation);
  const ry=y*Math.cos(tilt)-rz*Math.sin(tilt);
  const depth=y*Math.sin(tilt)+rz*Math.cos(tilt);
  const perspective=camera/(camera+depth+130);
  return {
   x:cx+rx*perspective*scale,
   y:cy+ry*perspective*scale,
   size:perspective,
   depth
  };
 }

 const projected=points.map(project);

 /* Soft cosmic atmosphere */
 const atmosphere=ctx.createRadialGradient(cx,cy,5,cx,cy,210*scale);
 atmosphere.addColorStop(0,"rgba(60,160,255,.16)");
 atmosphere.addColorStop(.5,"rgba(80,100,255,.06)");
 atmosphere.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=atmosphere;
 ctx.fillRect(cx-220*scale,cy-220*scale,440*scale,440*scale);

 /* Dust particles gather around Taurus */
 const gather=ease(elapsed/2200);
 for(let i=0;i<260;i++){
  const seed=i*12.9898;
  const angle=seed%6.283;
  const spread=35+(i*47%190);
  const target=projected[i%projected.length];

  const startX=cx+Math.cos(angle+time*.00012)*spread*scale;
  const startY=cy+Math.sin(angle)*spread*.62*scale;

  const drift=Math.sin(time*.001+i)*2.2*scale;
  const px=startX+(target.x-startX)*gather+drift;
  const py=startY+(target.y-startY)*gather+drift;

  const twinkle=.35+.65*Math.abs(Math.sin(time*.002+i));
  const size=(.45+(i%4)*.22)*scale;

  ctx.beginPath();
  ctx.arc(px,py,size,0,Math.PI*2);
  ctx.fillStyle=`rgba(170,220,255,${twinkle*.65})`;
  ctx.fill();
 }

 /* Constellation lines draw in sequence */
 const lineProgress=ease(elapsed/2800);
 links.forEach(([a,b],index)=>{
  const reveal=clamp(lineProgress*links.length-index,0,1);
  if(reveal<=0)return;

  const p=projected[a],q=projected[b];
  const x2=p.x+(q.x-p.x)*reveal;
  const y2=p.y+(q.y-p.y)*reveal;

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(x2,y2);
  ctx.strokeStyle="rgba(180,225,255,.72)";
  ctx.lineWidth=1.1*scale;
  ctx.shadowColor="#8acbff";
  ctx.shadowBlur=13;
  ctx.stroke();
 });

 /* Glowing 3D stars */
 projected.forEach((p,index)=>{
  const appear=ease((elapsed-index*130)/650);
  if(appear<=0)return;

  const pulse=.8+Math.sin(time*.003+index)*.2;
  const radius=(2.5+(index%3)*.6)*p.size*scale;

  ctx.save();
  ctx.globalAlpha=opacity*appear;

  const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius*8);
  glow.addColorStop(0,"rgba(255,255,255,1)");
  glow.addColorStop(.2,"rgba(160,220,255,.8)");
  glow.addColorStop(1,"rgba(100,160,255,0)");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(p.x,p.y,radius*8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.shadowColor="#bceaff";
  ctx.shadowBlur=20*pulse;
  ctx.beginPath();
  ctx.arc(p.x,p.y,radius*pulse,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 });

 /* Meteor flies from upper right to lower left */
 if(elapsed>2600&&elapsed<5400){
  const p=ease((elapsed-2600)/2800);
  const x=width*.94-width*.72*p;
  const y=height*.10+height*.36*p;
  const tail=155*scale;

  ctx.save();
  const meteor=ctx.createLinearGradient(x,y,x+tail,y-tail*.55);
  meteor.addColorStop(0,"rgba(255,255,255,1)");
  meteor.addColorStop(.25,"rgba(150,220,255,.8)");
  meteor.addColorStop(1,"rgba(120,150,255,0)");

  ctx.strokeStyle=meteor;
  ctx.lineWidth=2.5;
  ctx.shadowColor="#a8dfff";
  ctx.shadowBlur=24;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+tail,y-tail*.55);
  ctx.stroke();

  /* Meteor particle trail */
  for(let i=0;i<24;i++){
   const t=i/24;
   const px=x+tail*t;
   const py=y-tail*.55*t;
   const jitter=Math.sin(time*.02+i)*2;
   ctx.beginPath();
   ctx.arc(px+jitter,py+jitter,Math.max(.5,2*(1-t))*scale,0,Math.PI*2);
   ctx.fillStyle=`rgba(180,225,255,${(1-t)*.65})`;
   ctx.fill();
  }

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 }

 /* Taurus fades out with its particles */
 ctx.save();
 ctx.globalAlpha=opacity*ease((elapsed-3900)/500);
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.shadowColor="#9acfff";
 ctx.shadowBlur=22;
 ctx.fillStyle="#fff";
 ctx.font=`${36*scale}px Georgia,serif`;
 ctx.restore();

 ctx.restore();
}

/* ===================================
   AURORA BACKGROUND
=================================== */

function drawAurora(time){
 ctx.clearRect(0,0,width,height);

 if(showGraduationPhoto&&graduationPhoto.complete&&graduationPhoto.naturalWidth>0){
  const ir=graduationPhoto.naturalWidth/graduationPhoto.naturalHeight;
  const sr=width/height;
  let dw,dh,ox,oy;

  if(ir>sr){dh=height;dw=height*ir;ox=(width-dw)/2;oy=0;}
  else{dw=width;dh=width/ir;ox=0;oy=(height-dh)/2;}

  ctx.drawImage(graduationPhoto,ox,oy,dw,dh);
  ctx.fillStyle="rgba(2,7,18,.53)";
  ctx.fillRect(0,0,width,height);
 }else{
  const bg=ctx.createLinearGradient(0,0,0,height);
  bg.addColorStop(0,"#020611");
  bg.addColorStop(.55,"#07152a");
  bg.addColorStop(1,"#030712");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,width,height);
 }

 ctx.save();
 ctx.globalCompositeOperation="screen";

 const colors=[[30,255,190],[30,180,255],[130,90,255],[40,255,220]];

 colors.forEach((color,index)=>{
  const wave=ctx.createLinearGradient(0,height*.15,0,height*.8);
  wave.addColorStop(0,"rgba(0,0,0,0)");
  wave.addColorStop(.4,`rgba(${color.join(",")},.13)`);
  wave.addColorStop(.7,`rgba(${color.join(",")},.025)`);
  wave.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=wave;
  ctx.beginPath();
  ctx.moveTo(0,height*.3);

  for(let x=0;x<=width;x+=5){
   const y=height*.36+
    Math.sin(x*.006+time*.0004+index)*55+
    Math.sin(x*.002-time*.00025)*45;
   ctx.lineTo(x,y+index*24);
  }

  ctx.lineTo(width,height);
  ctx.lineTo(0,height);
  ctx.closePath();
  ctx.fill();
 });

 ctx.restore();
 drawStars();
 drawStarCoordinates(time);
}

function animate(time){
 drawAurora(time);
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ===================================
   GRADUATION COUNTDOWN
   Target: 30 November 2027
=================================== */

function updateCountdown(){
 const target=new Date(2027,10,30,0,0,0).getTime();
 const now=Date.now();
 let remaining=Math.max(0,target-now);

 const day=Math.floor(remaining/86400000);
 remaining%=86400000;
 const hour=Math.floor(remaining/3600000);
 remaining%=3600000;
 const minute=Math.floor(remaining/60000);
 remaining%=60000;
 const second=Math.floor(remaining/1000);

 document.getElementById("days").textContent=day;
 document.getElementById("hours").textContent=String(hour).padStart(2,"0");
 document.getElementById("minutes").textContent=String(minute).padStart(2,"0");
 document.getElementById("seconds").textContent=String(second).padStart(2,"0");
}
updateCountdown();
setInterval(updateCountdown,1000);

/* ===================================
   ORIGINAL ENCRYPTED GRADUATION LETTER
   KEEP ORIGINAL SALT / IV / CIPHERTEXT
=================================== */

const secretGate=document.getElementById("secretGate");
const secretPassword=document.getElementById("secretPassword");
const secretUnlock=document.getElementById("secretUnlock");
const secretError=document.getElementById("secretError");
const secretMessage=document.getElementById("secretMessage");
const decryptedText=document.getElementById("decryptedText");
const bgMusic=document.getElementById("bgMusic");

/*
 IMPORTANT:
 Keep the exact encryptedData object from your original index.html here.
 Do not change its salt, iv, or ciphertext.
*/

const encryptedData = {

/* ===================================
   GRADUATION LETTER DECRYPTION
=================================== */

function base64ToBytes(value){
 const binary=atob(value);
 return Uint8Array.from(binary,c=>c.charCodeAt(0));
}

async function deriveKey(password,salt){
 const encoder=new TextEncoder();
 const material=await crypto.subtle.importKey(
  "raw",encoder.encode(password),"PBKDF2",false,["deriveKey"]
 );
 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},
  material,{name:"AES-GCM",length:256},false,["decrypt"]
 );
}

let messageTimer=null;
let fadeTimer=null;

async function unlockSecret(){
 secretError.textContent="";
 const password=secretPassword.value;

 if(!password){secretError.textContent="Please enter the secret.";return;}
 if(!window.crypto||!crypto.subtle){secretError.textContent="Secure connection required.";return;}

 secretUnlock.disabled=true;

 try{
  const salt=base64ToBytes(encryptedData.salt);
  const iv=base64ToBytes(encryptedData.iv);
  const ciphertext=base64ToBytes(encryptedData.ciphertext);
  const key=await deriveKey(password,salt);

  const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ciphertext);
  const message=new TextDecoder().decode(decrypted);

  secretGate.classList.remove("active");
  secretPassword.value="";
  decryptedText.textContent=message;
  showGraduationPhoto=true;

  bgMusic.volume=.35;
  bgMusic.play().catch(()=>{});

  secretMessage.style.display="flex";
  requestAnimationFrame(()=>secretMessage.classList.add("show"));

  clearTimeout(messageTimer);
  clearTimeout(fadeTimer);

  messageTimer=setTimeout(()=>{
   secretMessage.classList.remove("show");
   fadeTimer=setTimeout(()=>{
    secretMessage.style.display="none";
    decryptedText.textContent="";
    showGraduationPhoto=false;
    bgMusic.pause();
    bgMusic.currentTime=0;
   },3000);
  },60000);

 }catch(error){
  console.error(error);
  secretError.textContent="The stars remain silent.";
  secretPassword.value="";
 }finally{
  secretUnlock.disabled=false;
 }
}

secretUnlock.addEventListener("click",unlockSecret);
secretPassword.addEventListener("keydown",e=>{if(e.key==="Enter")unlockSecret();});

document.getElementById("secretClose").addEventListener("click",()=>{
 secretGate.classList.remove("active");
 secretPassword.value="";
 secretError.textContent="";
});

/* ===================================
   SECRET WISHES — ENCRYPTED LOCAL VAULT
   AES-GCM + PBKDF2 + IndexedDB
=================================== */

const wishPanel=document.getElementById("wishPanel");
const wishPassword=document.getElementById("wishPassword");
const wishText=document.getElementById("wishText");
const wishStatus=document.getElementById("wishStatus");
const wishList=document.getElementById("wishList");

let wishDB=null;
let wishKey=null;
let wishVaultReady=false;

function openWishDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open("ChiayiSecretWishes",1);

  request.onupgradeneeded=()=>{
   const db=request.result;
   if(!db.objectStoreNames.contains("items")){
    db.createObjectStore("items",{keyPath:"id"});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function wishTransaction(mode,operation){
 return new Promise((resolve,reject)=>{
  const tx=wishDB.transaction("items",mode);
  const store=tx.objectStore("items");
  let request;

  try{request=operation(store);}catch(error){reject(error);return;}

  tx.oncomplete=()=>resolve(request?request.result:undefined);
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}

async function wishGetAll(){
 return wishTransaction("readonly",store=>store.getAll());
}

async function wishPut(record){
 return wishTransaction("readwrite",store=>store.put(record));
}

async function wishDelete(id){
 return wishTransaction("readwrite",store=>store.delete(id));
}

function randomBytes(length){
 return crypto.getRandomValues(new Uint8Array(length));
}

function bytesToBase64(bytes){
 let binary="";
 bytes.forEach(b=>binary+=String.fromCharCode(b));
 return btoa(binary);
}

async function deriveWishKey(password,salt){
 const material=await crypto.subtle.importKey(
  "raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]
 );

 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},
  material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]
 );
}

async function encryptWish(text,key){
 const iv=randomBytes(12);
 const data=new TextEncoder().encode(text);

 const encrypted=await crypto.subtle.encrypt(
  {name:"AES-GCM",iv},key,data
 );

 return {iv:bytesToBase64(iv),ciphertext:bytesToBase64(new Uint8Array(encrypted))};
}

async function decryptWish(record,key){
 const iv=base64ToBytes(record.iv);
 const data=base64ToBytes(record.ciphertext);

 const decrypted=await crypto.subtle.decrypt(
  {name:"AES-GCM",iv},key,data
 );

 return new TextDecoder().decode(decrypted);
}

async function openWishes(){
 wishPanel.classList.add("active");
 wishStatus.textContent="请输入愿望密码。";
 wishPassword.value="";
 wishText.value="";
 wishList.innerHTML="";
 wishKey=null;
 wishVaultReady=false;
 wishPassword.focus();

 try{
  if(!wishDB)wishDB=await openWishDB();

  const records=await wishGetAll();
  const vault=records.find(r=>r.id==="__vault__");

  if(vault){
   wishStatus.textContent="请输入你的愿望密码以解锁。";
  }else{
   wishStatus.textContent="第一次使用？请设置一个只有你知道的愿望密码。";
  }
 }catch(error){
  console.error(error);
  wishStatus.textContent="当前浏览器无法打开本地愿望储存。";
 }
}

async function unlockWishVault(){
 const password=wishPassword.value;

 if(!password||password.length<6){
  wishStatus.textContent="请设置至少 6 个字符的愿望密码。";
  return false;
 }

 if(!crypto.subtle){
  wishStatus.textContent="需要 HTTPS 安全连接才能加密。";
  return false;
 }

 const records=await wishGetAll();
 const vault=records.find(r=>r.id==="__vault__");

 if(!vault){
  const salt=randomBytes(16);
  const key=await deriveWishKey(password,salt);
  const encrypted=await encryptWish("CHIAYI_SECRET_WISH_VAULT_V1",key);

  await wishPut({
   id:"__vault__",
   salt:bytesToBase64(salt),
   iv:encrypted.iv,
   ciphertext:encrypted.ciphertext
  });

  wishKey=key;
  wishVaultReady=true;
  wishStatus.textContent="愿望保险箱已创建。现在可以写下愿望。";
  await renderWishes();
  return true;
 }

 try{
  const salt=base64ToBytes(vault.salt);
  const key=await deriveWishKey(password,salt);
  const check=await decryptWish(vault,key);

  if(check!=="CHIAYI_SECRET_WISH_VAULT_V1")throw new Error("Wrong password");

  wishKey=key;
  wishVaultReady=true;
  wishStatus.textContent="愿望保险箱已解锁。";
  await renderWishes();
  return true;

 }catch(error){
  wishKey=null;
  wishVaultReady=false;
  wishStatus.textContent="密码不正确，无法解锁愿望。";
  return false;
 }
}

async function renderWishes(){
 wishList.innerHTML="";
 const records=await wishGetAll();
 const wishes=records.filter(r=>r.id!=="__vault__");

 if(!wishes.length){
  wishList.textContent="这里还没有愿望。";
  return;
 }

 for(const record of wishes){
  const item=document.createElement("div");
  item.className="wish-item";

  const text=document.createElement("div");
  text.className="wish-item-text";

  try{
   text.textContent=await decryptWish(record,wishKey);
  }catch(error){
   text.textContent="无法读取这条愿望。";
  }

  const del=document.createElement("button");
  del.className="wish-delete";
  del.textContent="删除这条愿望";
  del.addEventListener("click",async()=>{
   if(!confirm("确定删除这条愿望吗？"))return;
   await wishDelete(record.id);
   await renderWishes();
   wishStatus.textContent="愿望已删除。";
  });

  item.appendChild(text);
  item.appendChild(del);
  wishList.appendChild(item);
 }
}

document.getElementById("openWishes").addEventListener("click",openWishes);

document.getElementById("saveWish").addEventListener("click",async()=>{
 try{
  if(!wishDB)wishDB=await openWishDB();

  if(!wishVaultReady){
   const unlocked=await unlockWishVault();
   if(!unlocked)return;
  }

  const text=wishText.value.trim();
  if(!text){
   wishStatus.textContent="先写下一个愿望吧。";
   return;
  }

  const encrypted=await encryptWish(text,wishKey);

  await wishPut({
   id:crypto.randomUUID(),
   iv:encrypted.iv,
   ciphertext:encrypted.ciphertext,
   createdAt:Date.now()
  });

  wishText.value="";
  wishStatus.textContent="✦ 愿望已经加密，交给星河保管。";
  await renderWishes();

 }catch(error){
  console.error(error);
  wishStatus.textContent="保存失败，请检查浏览器是否支持安全加密。";
 }
});

wishPassword.addEventListener("keydown",async e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  try{
   if(!wishDB)wishDB=await openWishDB();
   await unlockWishVault();
  }catch(error){
   wishStatus.textContent="无法打开本地愿望保险箱。";
  }
 }
});

document.getElementById("wishClose").addEventListener("click",()=>{
 wishPanel.classList.remove("active");
 wishKey=null;
 wishVaultReady=false;
 wishPassword.value="";
 wishText.value="";
 wishList.innerHTML="";
 wishStatus.textContent="";
});

/* ===================================
   HIDDEN FIVE-TAP PASSWORD ENTRANCE
=================================== */

let tapCount=0,lastTap=0,tapTimer=null;

window.addEventListener("pointerdown",event=>{
 if(
  secretGate.classList.contains("active")||
  secretMessage.classList.contains("show")||
  wishPanel.classList.contains("active")
 )return;

 const now=Date.now();
 const inSecretArea=event.clientX>width*.82&&event.clientY<height*.18;

 if(!inSecretArea){tapCount=0;return;}
 if(now-lastTap>2500)tapCount=0;

 lastTap=now;
 tapCount++;
 clearTimeout(tapTimer);
 tapTimer=setTimeout(()=>tapCount=0,2500);

 if(tapCount>=5){
  tapCount=0;
  secretGate.classList.add("active");
  secretPassword.focus();
 }
});

/* ===================================
   HIDDEN TAURUS TRIGGER
   BOTTOM LEFT CORNER
=================================== */

window.addEventListener("pointerdown",event=>{
 if(
  secretGate.classList.contains("active")||
  secretMessage.classList.contains("show")||
  wishPanel.classList.contains("active")
 )return;

 const hiddenStarArea=
  event.clientX<width*.18&&event.clientY>height*.82;

 if(hiddenStarArea){
  showStarCoordinates=true;
  constellationStartedAt=performance.now();
 }
});
</script>
