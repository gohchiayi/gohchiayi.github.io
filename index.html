
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>GOH CHIAYI — A Sky Full of Memories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030712;
    font-family: Georgia, "Times New Roman", serif;
}

body { color: white; }

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: relative;
    z-index: 2;
    height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
}

.name {
    font-size: clamp(30px, 8vw, 48px);
    font-weight: 400;
    letter-spacing: 8px;
    text-shadow: 0 0 25px rgba(130,255,220,.45);
}

.subtitle {
    margin-top: 20px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(220,245,255,.7);
}

.line {
    width: 55px;
    height: 1px;
    margin: 32px 0;
    background: rgba(180,255,240,.7);
    box-shadow: 0 0 12px #8affdf;
}

.footer {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(220,245,255,.65);
}

/* Password interface */

#secretGate {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(2,8,20,.94);
    backdrop-filter: blur(12px);
}

#secretGate.active { display: flex; }

.secret-card {
    width: min(100%, 340px);
    text-align: center;
    color: rgba(230,255,250,.9);
}

.secret-title {
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 28px;
    color: rgba(190,240,235,.7);
}

#secretPassword {
    width: 100%;
    padding: 14px 10px;
    border: none;
    border-bottom: 1px solid rgba(150,240,220,.45);
    outline: none;
    background: transparent;
    color: white;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 18px;
    letter-spacing: 4px;
}

#secretPassword::placeholder {
    color: rgba(220,245,255,.3);
    font-size: 12px;
    letter-spacing: 3px;
}

#secretUnlock {
    margin-top: 25px;
    padding: 10px 30px;
    border: 1px solid rgba(150,240,220,.35);
    background: transparent;
    color: rgba(220,255,245,.85);
    font-family: Georgia, serif;
    letter-spacing: 3px;
    font-size: 10px;
}

#secretError {
    min-height: 20px;
    margin-top: 18px;
    font-size: 11px;
    color: rgba(255,170,170,.75);
    letter-spacing: 1px;
}

#secretClose {
    margin-top: 20px;
    border: none;
    background: transparent;
    color: rgba(220,245,255,.4);
    font-size: 11px;
}

/* Graduation message */

#secretMessage {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2,8,20,.25);
    opacity: 0;
    transition: opacity 3s ease;
}

#secretMessage.show { opacity: 1; }

.letter {
    width: min(100%, 540px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    padding: 30px 23px;
    text-align: center;
    background: rgba(3,10,24,.38);
    border: 1px solid rgba(190,240,235,.16);
    border-radius: 14px;
    backdrop-filter: blur(5px);
    scrollbar-width: thin;
    scrollbar-color: rgba(150,240,220,.3) transparent;
}

.letter-title {
    font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
    font-size: clamp(25px,7vw,32px);
    font-weight: 400;
    letter-spacing: 5px;
    color: rgba(245,250,255,.98);
    text-shadow: 0 0 25px rgba(100,255,220,.45);
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 2.5s ease, transform 2.5s ease;
}

#secretMessage.show .letter-title {
    opacity: 1;
    transform: translateY(0);
}

.letter-subtitle {
    margin-top: 14px;
    margin-bottom: 25px;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(220,240,245,.75);
}

.letter-divider {
    width: 45px;
    height: 1px;
    margin: 0 auto 25px;
    background: rgba(180,255,240,.65);
    box-shadow: 0 0 12px #8affdf;
}

.letter-body {
    text-align: left;
    font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
    font-size: clamp(15px,4vw,17px);
    line-height: 2.05;
    letter-spacing: 1px;
    color: rgba(245,250,255,.96);
    text-shadow: 0 0 15px rgba(100,255,220,.2);
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

.letter-signature {
    margin-top: 28px;
    text-align: right;
    font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
    font-size: 15px;
    line-height: 2;
    letter-spacing: 1px;
    color: rgba(220,245,240,.9);
}

@media (max-height: 600px) {
    .letter { padding: 18px; }
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<audio id="bgMusic" src="audio/graduation.mp3" preload="auto" loop></audio>

<div class="content">
    <div class="name">GOH CHIAYI</div>

        <div class="secret-title">A LITTLE SECRET</div>

        <input
            id="secretPassword"
            type="password"
            placeholder="Enter the secret"
            autocomplete="off"

    </div>
</div>

<div id="secretMessage">
    <div class="letter">
        <div class="letter-title">致青春，致未来</div>
        <div class="letter-subtitle">献给吴嘉怡</div>
        <div class="letter-divider"></div>
        <div class="letter-body" id="decryptedText"></div>
        <div class="letter-signature">—— 傅玄策</div>
    </div>
</div>

<script>

/* ===================================
   ORIGINAL AURORA ANIMATION
=================================== */

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");

let width, height, stars = [];
let showGraduationPhoto = false;

let showStarCoordinates = false;
let constellationStartedAt = 0;

const graduationPhoto = new Image();
graduationPhoto.src = "images/chiayi.jpg";

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({length: 130}, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5,
        a: Math.random(),
        speed: Math.random() * 0.012 + 0.003
    }));
}

window.addEventListener("resize", resize);
resize();

function drawStars() {
    stars.forEach(s => {
        s.a += s.speed;

        const opacity = 0.25 + Math.abs(Math.sin(s.a)) * 0.65;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,245,255,${opacity})`;
        ctx.fill();
    });
}

/* ===================================
   CINEMATIC 3D TAURUS — 10 SECONDS
=================================== */

function drawStarCoordinates(time) {
    if (!showStarCoordinates) return;

    const elapsed = time - constellationStartedAt;
    const duration = 10000;

    if (elapsed >= duration) {
        showStarCoordinates = false;
        return;
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const ease = v => {
        v = clamp(v, 0, 1);
        return v * v * (3 - 2 * v);
    };

    const fadeIn = ease(elapsed / 1000);
    const fadeOut = 1 - ease((elapsed - 8200) / 1800);
    const opacity = fadeIn * fadeOut;

    const scale = Math.min(width / 390, height / 700, 1);
    const cx = width / 2;
    const cy = height * 0.39;

    ctx.save();
    ctx.globalAlpha = opacity;

    const stars3D = [
        [-105, -25, 10],
        [-65, -75, 0],
        [-15, -55, 25],
        [30, -90, -15],
        [75, -48, 15],
        [105, 5, -10],
        [45, 15, 30],
        [-10, 35, -20],
        [-65, 10, 15],
        [5, -5, 45],
        [115, -85, -35]
    ];

    const connections = [
        [0,1], [1,2], [2,3],
        [2,4], [4,5], [4,6],
        [6,7], [7,8], [2,9],
        [3,10]
    ];

    const rotation = elapsed * 0.00022;
    const tilt = Math.sin(elapsed * 0.0004) * 0.12;
    const camera = 520;

    function project(point) {
        const [x, y, z] = point;

        const rx = x * Math.cos(rotation) - z * Math.sin(rotation);
        const rz = x * Math.sin(rotation) + z * Math.cos(rotation);

        const ry = y * Math.cos(tilt) - rz * Math.sin(tilt);
        const depth = y * Math.sin(tilt) + rz * Math.cos(tilt);

        const perspective = camera / (camera + depth + 130);

        return {
            x: cx + rx * perspective * scale,
            y: cy + ry * perspective * scale,
            size: perspective,
            depth
        };
    }

    const projected = stars3D.map(project);

    /* Atmospheric glow */

    const atmosphere = ctx.createRadialGradient(
        cx, cy, 5,
        cx, cy, 190 * scale
    );

    atmosphere.addColorStop(0, "rgba(60,160,255,.13)");
    atmosphere.addColorStop(0.5, "rgba(80,100,255,.055)");
    atmosphere.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = atmosphere;
    ctx.fillRect(
        cx - 200 * scale,
        cy - 200 * scale,
        400 * scale,
        400 * scale
    );

    /* Floating cosmic particles */

    for (let i = 0; i < 65; i++) {
        const angle = i * 2.399;
        const distance = 75 + (i * 37 % 160);

        const px = cx + Math.cos(angle + time * 0.0001) * distance * scale;
        const py = cy + Math.sin(angle) * distance * 0.55 * scale;

        ctx.beginPath();
        ctx.arc(px, py, (i % 3 + 0.5) * scale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,220,255,${0.18 + (i % 4) * 0.08})`;
        ctx.fill();
    }

    /* 3D constellation lines */

    const progress = ease(elapsed / 3000);

    connections.forEach(([a, b], index) => {
        const start = projected[a];
        const end = projected[b];

        const reveal = clamp(progress * connections.length - index, 0, 1);
        if (reveal <= 0) return;

        const x2 = start.x + (end.x - start.x) * reveal;
        const y2 = start.y + (end.y - start.y) * reveal;

        const gradient = ctx.createLinearGradient(
            start.x, start.y, x2, y2
        );

        gradient.addColorStop(0, "rgba(120,190,255,.12)");
        gradient.addColorStop(0.5, "rgba(205,235,255,.9)");
        gradient.addColorStop(1, "rgba(110,210,255,.3)");

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.15 * scale;
        ctx.shadowColor = "#8acbff";
        ctx.shadowBlur = 12;
        ctx.stroke();
    });

    /* Glowing stars */

    projected.forEach((p, index) => {
        const appear = ease((elapsed - index * 170) / 650);
        if (appear <= 0) return;

        const pulse = 0.8 + Math.sin(time * 0.003 + index) * 0.2;
        const radius = (2.2 + (index % 3) * 0.7) * p.size * scale;

        ctx.save();
        ctx.globalAlpha = opacity * appear;

        const glow = ctx.createRadialGradient(
            p.x, p.y, 0,
            p.x, p.y, radius * 7
        );

        glow.addColorStop(0, "rgba(255,255,255,1)");
        glow.addColorStop(0.2, "rgba(160,220,255,.8)");
        glow.addColorStop(1, "rgba(100,160,255,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#bceaff";
        ctx.shadowBlur = 20 * pulse;

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });

    /* Cinematic meteor */

    if (elapsed > 2800 && elapsed < 5300) {
        const p = ease((elapsed - 2800) / 2500);

        const x = width * 0.92 - width * 0.72 * p;
        const y = height * 0.12 + height * 0.34 * p;

        const tailLength = 145 * scale;

        ctx.save();

        const meteorGradient = ctx.createLinearGradient(
            x, y,
            x + tailLength, y - tailLength * 0.55
        );

        meteorGradient.addColorStop(0, "rgba(255,255,255,1)");
        meteorGradient.addColorStop(0.2, "rgba(160,220,255,.85)");
        meteorGradient.addColorStop(1, "rgba(120,150,255,0)");

        ctx.strokeStyle = meteorGradient;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = "#a8dfff";
        ctx.shadowBlur = 25;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + tailLength, y - tailLength * 0.55);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    /* Cinematic typography */

    const textProgress = ease((elapsed - 4700) / 900);

    ctx.save();
    ctx.globalAlpha = opacity * textProgress;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "#9acfff";
    ctx.shadowBlur = 25;

    ctx.fillStyle = "rgba(235,245,255,.95)";
    ctx.font = `${11 * scale}px Arial`;
    ctx.fillText("HER CONSTELLATION", cx, cy + 115 * scale);

    ctx.fillStyle = "#ffffff";
    ctx.font = `${37 * scale}px Georgia, serif`;
    ctx.fillText("♉", cx, cy + 151 * scale);

    ctx.shadowBlur = 10;
    ctx.fillStyle = "rgba(205,230,255,.95)";
    ctx.font = `${13 * scale}px Georgia, serif`;
    ctx.fillText("TAURUS", cx, cy + 184 * scale);

    ctx.font = `${9 * scale}px Arial`;
    ctx.fillStyle = "rgba(190,220,245,.8)";
    ctx.fillText("MAY 03  ·  CHIAYI", cx, cy + 208 * scale);

    ctx.strokeStyle = "rgba(170,215,255,.55)";
    ctx.lineWidth = 0.7;

    ctx.beginPath();
    ctx.moveTo(cx - 35 * scale, cy + 232 * scale);
    ctx.lineTo(cx + 35 * scale, cy + 232 * scale);
    ctx.stroke();

    /* Romantic message */

    const quoteProgress = ease((elapsed - 5500) / 900);

    ctx.globalAlpha = opacity * quoteProgress;
    ctx.shadowColor = "#a5dfff";
    ctx.shadowBlur = 18;

    ctx.fillStyle = "#ffffff";
    ctx.font = `${14 * scale}px "Songti SC", Georgia, serif`;

    ctx.fillText("纵使星河万里，", cx, cy + 267 * scale);
    ctx.fillText("我的目光，始终为你停留。", cx, cy + 293 * scale);

    ctx.font = `${9 * scale}px Georgia, serif`;
    ctx.fillStyle = "rgba(205,230,255,.8)";
    ctx.fillText("— FROM XUANCE", cx, cy + 325 * scale);

    ctx.restore();
    ctx.restore();
}

/* ===================================
   DRAW ORIGINAL AURORA
=================================== */

function drawAurora(time) {
    ctx.clearRect(0, 0, width, height);

    if (
        showGraduationPhoto &&
        graduationPhoto.complete &&
        graduationPhoto.naturalWidth > 0
    ) {
        const imageRatio =
            graduationPhoto.naturalWidth /
            graduationPhoto.naturalHeight;

        const screenRatio = width / height;

        let drawWidth, drawHeight, offsetX, offsetY;

        if (imageRatio > screenRatio) {
            drawHeight = height;
            drawWidth = height * imageRatio;
            offsetX = (width - drawWidth) / 2;
            offsetY = 0;
        } else {
            drawWidth = width;
            drawHeight = width / imageRatio;
            offsetX = 0;
            offsetY = (height - drawHeight) / 2;
        }

        ctx.drawImage(
            graduationPhoto,
            offsetX,
            offsetY,
            drawWidth,
            drawHeight
        );

        ctx.fillStyle = "rgba(2,7,18,.53)";
        ctx.fillRect(0, 0, width, height);

    } else {
        const bg = ctx.createLinearGradient(0, 0, 0, height);

        bg.addColorStop(0, "#020611");
        bg.addColorStop(0.55, "#07152a");
        bg.addColorStop(1, "#030712");

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);
    }

    ctx.save();
    ctx.globalCompositeOperation = "screen";

    const colors = [
        [30,255,190],
        [30,180,255],
        [130,90,255],
        [40,255,220]
    ];

    colors.forEach((color, index) => {
        const wave = ctx.createLinearGradient(
            0, height * 0.15, 0, height * 0.8
        );

        wave.addColorStop(0, "rgba(0,0,0,0)");

        wave.addColorStop(
            0.4,
            `rgba(${color.join(",")},0.13)`
        );

        wave.addColorStop(
            0.7,
            `rgba(${color.join(",")},0.025)`
        );

        wave.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = wave;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.3);

        for (let x = 0; x <= width; x += 5) {
            const y =
                height * 0.36 +
                Math.sin(x * 0.006 + time * 0.0004 + index) * 55 +
                Math.sin(x * 0.002 - time * 0.00025) * 45;

            ctx.lineTo(x, y + index * 24);
        }

        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();
    });

    ctx.restore();

    drawStars();
    drawStarCoordinates(time);
}

function animate(time) {
    drawAurora(time);
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* ===================================
   ENCRYPTED GRADUATION LETTER
=================================== */

/*
IMPORTANT:
把你原本 HTML 里面完整的 encryptedData 密文复制过来。
不要修改 salt、iv 或 ciphertext。
*/

const encryptedData = {
    salt: "k1WOQVntrPYbU3maxr8Yrg==",
    iv: "276FcYUxCIDRdVK4",
    ciphertext: "在这里粘贴你原本完整的 ciphertext"
};

const secretGate = document.getElementById("secretGate");
const secretPassword = document.getElementById("secretPassword");
const secretUnlock = document.getElementById("secretUnlock");
const secretClose = document.getElementById("secretClose");
const secretError = document.getElementById("secretError");

const secretMessage = document.getElementById("secretMessage");
const decryptedText = document.getElementById("decryptedText");
const bgMusic = document.getElementById("bgMusic");

let secretTapCount = 0;
let secretTapTimer = null;
let letterCloseTimer = null;

/* ===================================
   BASE64 HELPER
=================================== */

function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}

/* ===================================
   AES-GCM DECRYPTION
=================================== */

async function unlockSecret() {
    const password = secretPassword.value;

    if (password !== "5+1") {
        secretError.textContent = "密码不正确，再试试看。";
        secretPassword.value = "";
        return;
    }

    if (
        !encryptedData.ciphertext ||
        encryptedData.ciphertext.includes("在这里粘贴")
    ) {
        secretError.textContent = "还没有放入原本的加密信件。";
        return;
    }

    secretUnlock.disabled = true;
    secretUnlock.textContent = "UNLOCKING...";

    try {
        const encoder = new TextEncoder();

        const keyMaterial = await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: base64ToBytes(encryptedData.salt),
                iterations: 600000,
                hash: "SHA-256"
            },
            keyMaterial,
            {
                name: "AES-GCM",
                length: 256
            },
            false,
            ["decrypt"]
        );

        const decryptedBuffer = await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: base64ToBytes(encryptedData.iv)
            },
            key,
            base64ToBytes(encryptedData.ciphertext)
        );

        const message = new TextDecoder().decode(decryptedBuffer);

        decryptedText.textContent = message;

        secretGate.classList.remove("active");
        secretMessage.style.display = "flex";

        requestAnimationFrame(() => {
            secretMessage.classList.add("show");
        });

        showGraduationPhoto = true;

        bgMusic.volume = 0.35;
        bgMusic.currentTime = 0;
        bgMusic.play().catch(() => {});

        clearTimeout(letterCloseTimer);

        letterCloseTimer = setTimeout(() => {
            closeSecretMessage();
        }, 60000);

    } catch (error) {
        console.error("Decryption error:", error);

        secretError.textContent =
            "无法解锁信件，请检查密码和原本的密文。";

        secretPassword.value = "";

    } finally {
        secretUnlock.disabled = false;
        secretUnlock.textContent = "UNLOCK";
    }
}

/* ===================================
   OPEN AND CLOSE PASSWORD GATE
=================================== */

function openSecretGate() {
    secretGate.classList.add("active");
    secretPassword.value = "";
    secretError.textContent = "";

    setTimeout(() => {
        secretPassword.focus();
    }, 100);
}

function closeSecretGate() {
    secretGate.classList.remove("active");
    secretPassword.value = "";
    secretError.textContent = "";
}

function closeSecretMessage() {
    clearTimeout(letterCloseTimer);

    secretMessage.classList.remove("show");

    bgMusic.pause();
    bgMusic.currentTime = 0;

    setTimeout(() => {
        secretMessage.style.display = "none";
        showGraduationPhoto = false;
    }, 3000);
}

secretUnlock.addEventListener("click", unlockSecret);

secretPassword.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        unlockSecret();
    }
});

secretClose.addEventListener("click", closeSecretGate);

/* ===================================
   FIVE-TAP HIDDEN PASSWORD ENTRANCE
   TOP RIGHT CORNER
=================================== */

window.addEventListener("pointerdown", event => {
    if (
        secretGate.classList.contains("active") ||
        secretMessage.classList.contains("show")
    ) {
        return;
    }

    const hiddenPasswordArea =
        event.clientX > width * 0.82 &&
        event.clientY < height * 0.18;

    if (!hiddenPasswordArea) return;

    secretTapCount++;

    clearTimeout(secretTapTimer);

    secretTapTimer = setTimeout(() => {
        secretTapCount = 0;
    }, 2500);

    if (secretTapCount >= 5) {
        secretTapCount = 0;
        openSecretGate();
    }
});

/* ===================================
   HIDDEN TAURUS CONSTELLATION
   BOTTOM LEFT CORNER
=================================== */

window.addEventListener("pointerdown", event => {
    if (
        secretGate.classList.contains("active") ||
        secretMessage.classList.contains("show")
    ) {
        return;
    }

    const hiddenStarArea =
        event.clientX < width * 0.18 &&
        event.clientY > height * 0.82;

    if (hiddenStarArea) {
        showStarCoordinates = true;
        constellationStartedAt = performance.now();
    }
});

</script>
