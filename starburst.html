
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starburst — Goh Chiayi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 100%, #101b42 0%, #070d20 45%, #02040d 100%);
    color: white;
    font-family: Georgia, serif;
    touch-action: manipulation;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    pointer-events: none;
    text-align: center;
    z-index: 2;
}

h1 {
    font-size: clamp(30px, 8vw, 60px);
    font-weight: 300;
    letter-spacing: 9px;
    text-shadow: 0 0 25px #75dfff;
}

.subtitle {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #a8cde9;
}

.instruction {
    position: absolute;
    bottom: 12%;
    font-size: 12px;
    letter-spacing: 3px;
    color: #9db9d8;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { opacity: .35; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="starCanvas"></canvas>
