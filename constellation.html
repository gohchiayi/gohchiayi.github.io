<title>Our Constellation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #030613;
    font-family: Georgia, serif;
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    pointer-events: none;
}

h1 {
    font-size: clamp(30px, 8vw, 65px);
    font-weight: 300;
    letter-spacing: 9px;
    text-shadow: 0 0 25px #80dfff;
    animation: glow 4s infinite alternate;
}

.subtitle {
    margin-top: 20px;
    font-size: 12px;
    letter-spacing: 5px;
    color: #b9d9ed;
}

.line {
    width: 90px;
    height: 1px;
    margin-top: 30px;
    background: #9deaff;
    box-shadow: 0 0 15px #6ddfff;
}

.message {
    margin-top: 25px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9eb9d5;
}

@keyframes glow {
    from { opacity: .7; }
    to { opacity: 1; text-shadow: 0 0 35px #71dfff; }
}
</style>
</head>
